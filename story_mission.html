<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 탐험대</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#F2F8FF;--white:#fff;--ink:#2C2C3A;--ink-soft:#5A5A72;--border:#D8E4F2;
  --blue:#4285F4;--blue-light:#EAF2FF;--blue-dark:#1a56c4;
  --teal:#38C9A0;--teal-light:#D9F7EE;--teal-dark:#0a6b50;
  --purple:#7B6CF6;--purple-light:#EDE9FF;--purple-dark:#3C3489;
  --coral:#FF7B6B;--coral-light:#FFECE9;--coral-dark:#C4402E;
  --amber:#F9A825;--amber-light:#FFF3D0;--amber-dark:#854F0B;
  --r:18px;--r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--sky);color:var(--ink);min-height:100vh;padding-bottom:60px}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:var(--ink)}
.fun{font-family:'Gaegu',cursive;font-weight:700}

/* 헤더 */
header{background:var(--white);border-bottom:1.5px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:20}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hd-logo{width:40px;height:40px;background:var(--purple-light);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hd-title{font-size:22px;line-height:1}
.hd-sub{font-size:11px;color:var(--ink-soft)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{background:var(--amber-light);color:var(--amber-dark);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.lv{background:var(--purple-light);color:var(--purple-dark)}
.xpbar{max-width:720px;margin:8px auto 0;height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));border-radius:99px;transition:width .6s}

main{max-width:720px;margin:18px auto;padding:0 16px}
.card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.btn{padding:12px 18px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:700;transition:all .15s;width:100%}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-coral{background:var(--coral);color:#fff}
.btn-ghost{background:var(--white);color:var(--ink-soft);border:1.5px solid var(--border)}
.btn-gemini{background:linear-gradient(135deg,#4285F4,#9B72CB,#D96570);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.lbl{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}

/* 시작 화면 */
.hero-start{text-align:center;padding:30px 20px}
.hero-start .big{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.hero-start h1{font-size:40px;margin:8px 0 4px;color:var(--purple-dark)}
.hero-start p{color:var(--ink-soft);font-size:14px;line-height:1.7}
.name-in{width:100%;max-width:280px;padding:14px;border-radius:var(--r-sm);border:2px solid var(--border);font-size:18px;text-align:center;margin:18px auto 10px;display:block}
.name-in:focus{outline:none;border-color:var(--purple)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 미션 지도 */
.map-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.map-head h2{font-size:28px;color:var(--purple-dark)}
.map{position:relative;padding:4px 0}
.node{display:flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;width:88%;transition:transform .15s;position:relative}
.node:nth-child(even){margin-left:12%}
.node .ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.node .nt{font-size:11px;font-weight:700;color:var(--ink-soft)}
.node .nn{font-size:22px;line-height:1.2}
.node .nd{font-size:12px;color:var(--ink-soft)}
.node .st{margin-left:auto;font-size:22px}
.node.open{cursor:pointer;border-color:var(--purple);box-shadow:0 4px 0 var(--purple-light)}
.node.open:hover{transform:translateY(-2px)}
.node.open .st{animation:bob 1.6s infinite}
.node.done{cursor:pointer;border-color:var(--teal);background:var(--teal-light)}
.node.lock{opacity:.5}
.node.lock .ic{filter:grayscale(1)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{background:var(--amber-light);border:1.5px solid #F5D98A;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--amber-dark)}
.badge.off{background:#F3F4F8;border-color:var(--border);color:#B0B4C4}

/* 미션 화면 */
.m-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:var(--white);border:1.5px solid var(--border);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.m-title{font-size:26px}
.qdots{display:flex;gap:6px;margin-left:auto}
.qdots span{width:12px;height:12px;border-radius:50%;background:var(--border)}
.qdots span.done{background:var(--teal)}
.qdots span.now{background:var(--purple);transform:scale(1.25)}
.chat{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;min-height:300px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.7;white-space:pre-wrap;animation:pop .25s ease-out}
.bub.ai{background:var(--purple-light);color:var(--purple-dark);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub.think{background:#FFF8E6;color:#6B4A06;border:1.5px dashed #F5C46B}
.chip.starter{border-style:dashed;border-color:#F5C46B;color:#6B4A06}
.deep-toggle{border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--white);color:var(--ink-soft)}
.deep-toggle.on{background:#FFF8E6;border-color:#F5C46B;color:#6B4A06}
.bub.reward{align-self:center;background:var(--amber-light);color:var(--amber-dark);font-weight:700;font-size:13px;padding:6px 14px}
.bub .who{font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--white);border:1.5px solid var(--purple);color:var(--purple-dark);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500}
.chip:hover{background:var(--purple-light)}
.chip.sel{background:var(--purple);color:#fff}
.inrow{display:flex;gap:8px}
.inrow textarea{flex:1;padding:12px 14px;border-radius:var(--r-sm);border:2px solid var(--border);font-size:15px;resize:none;line-height:1.5}
.inrow textarea:focus{outline:none;border-color:var(--purple)}
.send{width:64px;flex-shrink:0;border:none;border-radius:var(--r-sm);background:var(--purple);color:#fff;font-size:22px}
.idea{margin-top:8px;background:none;border:1.5px dashed #B8A9F5;color:var(--purple-dark);border-radius:var(--r-sm);padding:9px;font-size:13px;width:100%;font-weight:500}
.tip{font-size:12px;color:var(--ink-soft);background:var(--amber-light);border-radius:var(--r-sm);padding:10px 12px;line-height:1.6;margin-bottom:12px}

/* 이야기 컷 */
.sum{background:var(--blue-light);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;margin-bottom:12px}
.scene{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:10px}
.scene .sh{font-size:20px;margin-bottom:4px}
.scene textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:14px;line-height:1.7;resize:vertical;min-height:80px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle;font-family:'Noto Sans KR'}
.t1{background:var(--blue-light);color:var(--blue-dark)}.t2{background:var(--coral-light);color:var(--coral-dark)}
.t3{background:var(--amber-light);color:var(--amber-dark)}.t4{background:var(--teal-light);color:var(--teal-dark)}
textarea.paste{width:100%;border:2px dashed var(--border);border-radius:var(--r-sm);padding:12px;font-size:13px;line-height:1.7;resize:vertical;margin:8px 0}

/* 스토리보드 */
.cut-tabs{display:flex;gap:6px;margin-bottom:12px}
.cut-tabs button{flex:1;padding:10px 4px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:700;color:var(--ink-soft)}
.cut-tabs button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.cut-tabs button.ok:not(.on){border-color:var(--teal);color:var(--teal-dark);background:var(--teal-light)}
.bq{margin-bottom:16px}
.bq .q{font-size:15px;font-weight:700;margin-bottom:8px}
.bq input{width:100%;padding:11px 13px;border-radius:var(--r-sm);border:2px solid var(--border);font-size:14px}
.bq input:focus{outline:none;border-color:var(--purple)}
.cam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cam{border:2px solid var(--border);background:var(--white);border-radius:var(--r-sm);padding:10px 4px;font-size:12px;text-align:center;line-height:1.4}
.cam b{display:block;font-size:24px}
.cam.sel{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark);font-weight:700}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:2px solid transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.mood.sel{border-color:var(--ink)}
.draw-tabs{display:flex;gap:6px;margin-bottom:8px}
.draw-tabs button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:700;color:var(--ink-soft)}
.draw-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.canvas-wrap{border:2px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.pal{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pal .c{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--border)}
.pal .c.sel{box-shadow:0 0 0 2.5px var(--ink)}
.pal .tool{padding:6px 10px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700}
.pal .tool.sel{background:var(--ink);color:#fff}
.preview-img{width:100%;border-radius:var(--r-sm);border:2px solid var(--border);display:block}

/* 완성 스토리보드 */
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.sb .frame{aspect-ratio:3/2;background:#F6F7FB;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.sb .frame img{width:100%;height:100%;object-fit:cover}
.sb .num{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.sb .info{padding:10px;font-size:12px;line-height:1.6;border-top:2px solid var(--ink)}
.sb .info .line{background:var(--blue-light);border-radius:10px;padding:5px 9px;margin:5px 0;font-weight:500}
.sb .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sb .meta span{font-size:10px;background:#F3F4F8;border-radius:99px;padding:2px 8px;color:var(--ink-soft)}
.book-title{text-align:center;font-size:36px;color:var(--purple-dark);line-height:1.2}
.book-by{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:16px}

/* 장르 고르기 */
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.g-card{background:var(--white);border:2px solid var(--border);border-radius:var(--r);padding:14px;text-align:left;transition:all .15s}
.g-card:hover{border-color:#B8A9F5;transform:translateY(-2px)}
.g-card.sel{border-color:var(--purple);background:var(--purple-light);box-shadow:0 4px 0 #CFC6FB}
.g-card .gi{font-size:34px;line-height:1}
.g-card .gn{font-size:22px;margin:4px 0 2px;color:var(--ink)}
.g-card .gd{font-size:12px;color:var(--ink-soft);line-height:1.5}
.g-detail{background:var(--purple-light);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.8;color:var(--purple-dark);margin-bottom:12px}
.ex-book{background:#FFFBF0;border:2px solid #F5D98A;border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.ex-lbl{font-size:11px;font-weight:700;color:var(--amber-dark);margin-bottom:2px}
.ex-title{font-size:24px;color:var(--amber-dark);margin-bottom:6px}
.ex-text{font-size:14px;line-height:1.9;color:var(--ink)}
.course{margin-bottom:12px}
.course-row{display:flex;flex-wrap:wrap;gap:6px}
.course-step{background:var(--white);border:1.5px solid var(--border);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:500}
.genre-tag{display:inline-block;background:var(--purple-light);color:var(--purple-dark);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}

/* 모달/토스트/폭죽 */
.modal-bg{position:fixed;inset:0;background:rgba(30,30,60,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:24px;padding:28px 22px;max-width:360px;width:100%;text-align:center;animation:pop .3s}
.modal .bigic{font-size:72px;animation:bob 1.6s infinite}
.modal h3{font-size:32px;color:var(--purple-dark);margin:6px 0}
.modal p{font-size:14px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center;line-height:1.5;animation:pop .25s}
.conf{position:fixed;top:-40px;font-size:26px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:520px){
  .node{width:100%}.node:nth-child(even){margin-left:0}
  .sb-grid{grid-template-columns:1fr}
  .cam-grid{grid-template-columns:repeat(2,1fr)}
  .hd-sub{display:none}
}
@media print{
  header,.no-print{display:none!important}
  body{background:#fff;padding:0}
  main{margin:0;max-width:none}
  .card{border:none;padding:0}
  .sb{break-inside:avoid}
}
.save-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.save-note{font-size:12px;color:var(--ink-soft);margin-right:auto}
.resume{font-size:12px;font-weight:700;color:var(--purple,#7c5cff);white-space:nowrap}
.modal.my-story{max-width:520px;text-align:left;padding:22px 18px;max-height:88vh;display:flex;flex-direction:column}
.my-story h3{text-align:center;font-size:28px}
.ms-body{overflow-y:auto;margin:4px 0 14px;padding-right:4px}
.ms-sec{border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.ms-sec.empty{opacity:.5}
.ms-h{font-weight:700;color:var(--purple-dark);margin-bottom:6px}
.ms-h small{font-weight:400;color:var(--ink-soft);margin-left:4px}
.ms-item{font-size:14px;line-height:1.6;padding:4px 0;border-top:1px dashed var(--border)}
.ms-item:first-of-type{border-top:0}
.ms-lbl{display:inline-block;font-size:11px;font-weight:700;background:var(--purple-light);color:var(--purple-dark);border-radius:99px;padding:1px 8px;margin-right:6px}
.ms-why{font-size:13px;color:var(--ink-soft);margin:2px 0 0 10px}
.ms-none{font-size:13px;color:var(--ink-soft)}
.ms-cut{display:flex;gap:10px;align-items:center}
.ms-cut img{width:72px;height:54px;object-fit:cover;border-radius:8px;flex-shrink:0}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-logo">🗺️</div>
    <div>
      <div class="hd-title fun">이야기 탐험대</div>
      <div class="hd-sub">미션을 깨면서 나만의 이야기와 스토리보드를 만들어요</div>
    </div>
    <div class="hd-right" id="hdRight"></div>
  </div>
  <div class="xpbar" id="xpWrap" style="display:none"><div id="xpFill" style="width:0"></div></div>
</header>

<main id="app"></main>
<input type="file" id="loadFile" accept=".json,application/json" hidden onchange="importSave(this)">

<script>
// ===== 미션 정의 =====
// ===== 이야기 장르 =====
// 장르마다 이야기 순서(미션 코스)가 달라요.
// 주인공·세상 미션은 모든 장르가 함께 쓰고 보기만 바꾸고, 그 뒤 미션 3개는 장르마다 따로 있어요.
const GENRES = [
  { id:'quest', icon:'🎯', name:'미션 이야기', desc:'미션을 받고 관문을 하나씩 통과해요',
    guide:'주인공이 중요한 미션을 받고, 여러 관문(시련)을 하나씩 통과해서 미션을 완수하는 이야기',
    ex:{ title:'토리와 별빛 열쇠', text:'토리는 마을의 꺼진 등불을 다시 켜라는 미션을 받았어요. 미션을 이루려면 별빛 열쇠를 찾아야 했죠. 토리는 수수께끼 문과 흔들다리, 잠자는 거인 옆을 지나야 했어요. 무서웠지만 한 걸음씩 나아간 토리는 마침내 열쇠를 찾아 마을을 다시 밝혔답니다.' },
    heroTypes:['씩씩한 아이','꼬마 기사','아기 용','용감한 생쥐','로봇'],
    places:['깊은 숲속','바닷속 마을','구름 위 성','산꼭대기 마을','과자 나라'],
    titles:['{heroName}의 비밀 미션','세 개의 관문','{place}를 구하라!'],
    steps:[
      { icon:'📜', name:'미션 도착', desc:'주인공이 비밀 미션을 받아요', qs:[
        { k:'mission', label:'받은 미션', q:'두근두근! {heroName}에게 비밀 미션이 도착했어 📜\n어떤 미션일까?', chips:['잃어버린 왕관 찾기','아픈 나무를 살릴 약초 구하기','갇힌 친구 구하기','꺼진 마을 불빛 되찾기'] },

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ toast('저장 공간이 꽉 찼어요. 그림 크기를 줄여 볼게요!'); } }

// ===== 중간 저장 파일 =====
// 브라우저에는 답할 때마다 자동 저장되지만, 다른 컴퓨터에서 이어 하려면 파일로 내려받아 가져가요
function exportSave(){
  const d = new Date(), day = `${d.getMonth()+1}월${d.getDate()}일`;
  const blob = new Blob([JSON.stringify({ app:'story_mission', v:1, S })], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `이야기탐험대_${S.name}_${day}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showModal('💾', '중간 저장 완료!', `<b>${esc(a.download)}</b> 파일이 다운로드 폴더에 저장됐어요.<br><br>다음에 <b>📂 불러오기</b>로 이 파일을 고르면<br>이어서 만들 수 있어요!`, '좋아요');
}
function pickSaveFile(){ $('loadFile').click(); }
function importSave(input){
  const f = input.files[0]; input.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try{ d = JSON.parse(r.result); }catch(e){ d = null; }
    const s = d && d.app === 'story_mission' ? d.S : null;
    if (!s || !s.name){ toast('이야기 탐험대 저장 파일이 아니에요 😢'); return; }
    if (S.name && Object.keys(S.done).length && !confirm(`지금 만들던 이야기 대신 「${s.name}」 작가의 저장 파일을 불러올까요?\n지금 이야기는 사라져요.`)) return;
    S = Object.assign({ name:'', xp:0, done:{}, a:{}, scenes:['','','',''], board:blankBoard() }, s);
    MISSIONS = genre() ? buildCourse(genre()) : [];
    save(); go(genre() ? 'home' : 'genre');
    toast(`📂 ${s.name} 작가의 이야기를 불러왔어요! 이어서 만들어요 ✨`);
  };
  r.readAsText(f);
}
const saveBar = () => `

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hasBatchim(word){
  const ch = String(word||'').trim().slice(-1); const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  return false;
}
// "{heroName}{은는}" 같은 템플릿을 채우고 조사를 맞춰 줘요
function fill(tpl){
  return tpl.replace(/\{(\w+)\}(\{(은는|이가|을를|과와)\})?/g, (m, k, _j, j) => {
    const v = S.a[k] || '주인공';
    if (!j) return v;
    const b = hasBatchim(v);
    return v + ({ '은는':b?'은':'는', '이가':b?'이':'가', '을를':b?'을':'를', '과와':b?'과':'와' })[j];
  });
}
function level(){ let l = LEVELS[0], i = 0; LEVELS.forEach((x,n) => { if (S.xp >= x.xp){ l = x; i = n; } }); return { ...l, i, next: LEVELS[i+1] }; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3400);
}
function confetti(){
  const em = ['⭐','✨','🎉','🌟','💖','🎈'];
  for (let i = 0; i < 28; i++){
    const c = document.createElement('div'); c.className = 'conf';
    c.textContent = em[i % em.length];
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function addXP(n){
  const before = level().i;
  S.xp += n; save(); renderHeader();
  if (level().i > before) setTimeout(() => showModal('🆙', '레벨 업!', `축하해요! 이제 <b>${level().name}</b>예요!`, '좋아요!'), 700);
}
function showModal(icon, title, html, btn, onOk){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="bigic">${icon}</div><h3 class="fun">${title}</h3><p>${html}</p><button class="btn btn-purple">${btn}</button></div>`;
  bg.querySelector('button').onclick = () => { bg.remove(); onOk && onOk(); };
  document.body.appendChild(bg);
}
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  fallbackCopy(text); return Promise.resolve();
}
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
}

// ===== Gemini 연결 (내 구글 계정으로 Gemini 사이트 열기) =====
function openGemini(prompt, msg){
  copyText(prompt);
  const url = 'https://gemini.google.com/?q=' + encodeURIComponent(prompt);
  let w = null;
  try { w = window.open(url, '_blank'); } catch(e){}
  // 브라우저가 새 창을 막으면, 직접 누를 수 있는 링크와 질문을 보여 줘요
  if (!w){ showGeminiBox(url, prompt); return; }
  toast(msg || 'Gemini가 열렸어요! 질문이 안 보이면 입력칸에 붙여넣기(Ctrl+V / 길게 눌러 붙여넣기) 해요 📋');
}
function showGeminiBox(url, prompt){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" style="text-align:left">
    <div style="text-align:center;font-size:44px">🔷</div>

    <a class="btn btn-gemini" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="${url}" target="_blank" rel="noopener">🔷 Gemini 열기</a>
    <textarea readonly style="width:100%;height:110px;border:1.5px solid var(--border);border-radius:10px;padding:8px;font-size:12px;line-height:1.6;margin-bottom:8px">${esc(prompt)}</textarea>
    <div class="row">
      <button class="btn btn-ghost" data-act="copy">📋 질문 다시 복사</button>
      <button class="btn btn-purple" data-act="close">닫기</button>
    </div></div>`;
  bg.querySelector('[data-act=copy]').onclick = () => copyText(prompt).then(() => toast('질문을 복사했어요! Gemini 입력칸에 붙여넣어요 📋'));
  bg.querySelector('[data-act=close]').onclick = () => bg.remove();

}
function getQ(mi, n){ return MISSIONS[mi].qs[n]; }
function storySoFar(){
  const g = genre(), L = [];
  if (g) L.push(`장르: ${g.name} — ${g.guide}`);
  MISSIONS.forEach(m => (m.qs || []).forEach(q => {
    if (S.a[q.k]) L.push(`${q.label}: ${S.a[q.k]}`);
    if (S.a[q.k + '_why']) L.push(`  └ 아이의 생각(왜/만약): ${S.a[q.k + '_why']}`);
  }));
  return L.join('\n');
}
// 소크라테스식: Gemini도 답을 주지 않고, 아이가 스스로 생각하도록 되물어 줘요
const SOCRATIC_RULE = `너는 초등학생과 이야기를 만드는 소크라테스 선생님이야.
- 절대로 정답이나 완성된 문장을 먼저 알려주지 마.
- 대신 아이가 스스로 떠올릴 수 있게 쉬운 질문을 2~3개 해줘. ("왜 그럴까?", "만약 ~라면?", "다른 인물은 어떤 마음일까?", "앞에서 정한 내용과 어떻게 이어질까?" 같은 질문)
- 질문 뒤에, 아이가 그래도 막히면 볼 수 있게 "🔑 작은 힌트"를 한 줄만 줘.
- 쉬운 말, 짧은 문장, 이모지를 써줘.`;
function askIdea(){
  const q = getQ(view.mission, view.q);
  const now = view.follow ? followText(q) : fill(q.q);
  const prompt = `${SOCRATIC_RULE}

[지금까지 만든 이야기]
${storySoFar() || '(아직 없음)'}

[아이가 지금 고민하는 질문]
${now.replace(/\n/g,' ')}`;
  openGemini(prompt, 'Gemini 선생님이 질문으로 도와줄 거예요! 질문에 답하다 보면 내 생각이 떠올라요 🧠');
}

    <button class="idea" onclick="askIdea()">💡 잘 모르겠어요 → Gemini 선생님께 생각 도움 받기</button>`;
  // 이미 답한 질문은 대화로 다시 보여 줘요
  for (let n = 0; n < view.q; n++){
    const q = getQ(i, n), why = S.a[q.k + '_why'];
    bubble(fill(q.q), 'ai', true); bubble(S.a[q.k], 'me', true);
    if (why && FOLLOW[q.k]){ bubble(followText(q), 'think', true); bubble(why, 'me', true); }
  }
  askQ();

function bubble(text, who, instant){
  const chat = $('chat'); if (!chat) return;
  const d = document.createElement('div'); d.className = 'bub ' + (who === 'think' ? 'ai think' : who);
  if (instant) d.style.animation = 'none';
  const head = who === 'ai' ? '<div class="who">🧚 별이</div>'
    : who === 'think' ? `<div class="who">🧚 별이 · 🧠 생각 질문</div>` : '';
  d.innerHTML = head + esc(text);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function askQ(){
  const m = MISSIONS[view.mission], q = getQ(view.mission, view.q);
  view.follow = false;
  bubble(fill(q.q), 'ai');
  $('chipBox').innerHTML = q.chips.map(c => `<button class="chip" onclick="pickChip(this)">${esc(fill(c))}</button>`).join('');
  const ta = $('ans'); ta.value = S.a[q.k] || ''; ta.placeholder = '내 생각을 써 봐요 (위의 보기를 눌러도 돼요)'; ta.focus();
}
function pickChip(el){ const ta = $('ans'); ta.value = el.textContent; ta.focus(); }

// ===== 소크라테스식 생각 질문 =====
// 답을 정해 주지 않고 "왜?", "만약?", "다른 사람이라면?"을 되물어서 아이가 스스로 이야기를 깊게 만들어요
const FOLLOW = {
  heroWeak:{ t:'이유 찾기',   q:'{heroName}{은는} 왜 그럴까? 🤔\n예전에 무슨 일이 있었던 걸까?' },
  feeling: { t:'마음 읽기',   q:'{heroName}{이가} 왜 그런 마음이 들었을까?\n너라면 어떤 기분이었을 것 같아? 💭' },
  cause:   { t:'이유 찾기',   q:'왜 그런 일이 생겼다고 생각해? 🤔\n이야기 속에 그걸 알려 주는 단서를 하나 숨긴다면 뭘까?' },
  reason:  { t:'다른 입장',   q:'그때 친구는 어떤 마음이었을까?\n친구 입장에서 생각해 볼래? 👀' },
  try1:    { t:'다른 방법',   q:'왜 처음엔 잘 안 됐을까?\n다른 방법은 없었을까? 🔄' },
  gate2:   { t:'만약에',     q:'만약 여기서 {heroName}{이가} 포기했다면 어떻게 됐을까? 🔮' },
  choice:  { t:'이유 찾기',   q:'{heroName}{은는} 왜 그렇게 행동했을까?\n다르게 할 수도 있었을까? 🔄' },
  suspect: { t:'근거 찾기',   q:'왜 그 사람을 의심했어? 🔍\n어떤 단서 때문이야?' },
  culprit: { t:'다른 입장',   q:'{culprit}{은는} 왜 그런 일을 했을까?\n그쪽의 마음을 상상해 볼래? 🕵️' },
  helper:  { t:'다른 입장',   q:'{helper}{은는} 왜 {heroName}{을를} 도와줬을까?\n도와준 쪽의 입장에서 생각해 봐! 👀' },
  final:   { t:'원인 찾기',   q:'그 방법은 왜 성공했을까?\n처음과 무엇이 달라졌을까? 💡' },
  how:     { t:'근거 찾기',   q:'그 증거가 왜 결정적이었을까?\n다른 사람은 왜 그걸 못 봤을까? 💡' },
  ending:  { t:'만약에',     q:'만약 이야기가 반대로 끝났다면 어땠을까? 🔮\n왜 이 결말이 더 좋아?' },
  change:  { t:'근거 찾기',   q:'이야기 속 어느 장면을 보면 {heroName}{이가} 달라진 걸 알 수 있을까? 🔎' },
  lesson:  { t:'생활과 연결', q:'이 교훈이 진짜 생활에서도 필요했던 적이 있어?\n언제였는지 떠올려 볼래? 🌱' },
};
const THINK_PRAISE = ['오~ 그런 이유가 있었구나! 🧠','생각이 쑥쑥 깊어지고 있어 🌱','와, 그건 진짜 작가만 할 수 있는 생각이야!','그 생각 덕분에 이야기가 더 살아났어 ✨'];
const SKIP = '🤷 잘 모르겠어, 다음에 생각할래';
const MAX_FOLLOW = 2;   // 한 미션에서 생각 질문은 최대 2번까지만 (아이들이 지치지 않게)
const deepOn = () => S.deep !== false;
function followText(q){ return `[${FOLLOW[q.k].t}] ` + fill(FOLLOW[q.k].q); }
function askFollow(q){
  view.follow = true; view.fcount = (view.fcount || 0) + 1;
  bubble(followText(q), 'think');
  $('chipBox').innerHTML = `<button class="chip" onclick="pickChip(this)">${SKIP}</button>`
    + ['왜냐하면 ','만약에 ','내 생각에는 '].map(s => `<button class="chip starter" onclick="startWith(this)">${s}…</button>`).join('');
  const ta = $('ans'); ta.value = S.a[q.k + '_why'] || ''; ta.placeholder = '정답은 없어! 떠오르는 대로 써 봐요 🧠'; ta.focus();
}
function startWith(el){ const ta = $('ans'); ta.value = el.textContent.replace('…',''); ta.focus(); }
function answerFollow(v){
  const q = getQ(view.mission, view.q);
  view.follow = false;
  bubble(v, 'me'); $('ans').value = ''; $('chipBox').innerHTML = '';
  if (v === SKIP){ setTimeout(() => bubble('괜찮아! 생각은 천천히 해도 돼 😊', 'ai'), 400); setTimeout(nextQ, 900); return; }
  const isNew = !S.a[q.k + '_why'];
  S.a[q.k + '_why'] = v; save();
  if (isNew){ S.thinks = (S.thinks || 0) + 1; addXP(15); setTimeout(() => bubble('🧠 깊은 생각 ⭐ +15', 'reward'), 250); }
  setTimeout(() => bubble(THINK_PRAISE[Math.floor(Math.random()*THINK_PRAISE.length)], 'ai'), 500);
  setTimeout(nextQ, 1100);
}

function sendAnswer(){
  const ta = $('ans'), v = ta.value.trim();
  if (!v){ toast('생각을 한 줄이라도 써 줘요! 보기를 눌러도 돼요 😊'); return; }
  if (view.follow) return answerFollow(v);
  const m = MISSIONS[view.mission], q = getQ(view.mission, view.q);
  const isNew = !S.a[q.k];
  S.a[q.k] = v; save();
  bubble(v, 'me'); ta.value = ''; $('chipBox').innerHTML = '';
  if (isNew){ addXP(10); setTimeout(() => bubble('⭐ +10', 'reward'), 250); }
  if (deepOn() && FOLLOW[q.k] && (view.fcount || 0) < MAX_FOLLOW){
    setTimeout(() => bubble(PRAISE[Math.floor(Math.random()*PRAISE.length)], 'ai'), 500);
    setTimeout(() => askFollow(q), 1100);
    return;
  }
  nextQ(true);
}
function nextQ(praise){
  const m = MISSIONS[view.mission];
  view.q++;
  document.querySelectorAll('.qdots span').forEach((s,n) => s.className = n < view.q ? 'done' : n === view.q ? 'now' : '');
  if (view.q < m.qs.length){
    if (praise) setTimeout(() => { bubble(PRAISE[Math.floor(Math.random()*PRAISE.length)], 'ai'); }, 500);
    setTimeout(askQ, praise ? 1100 : 300);
  } else {
    setTimeout(() => bubble('미션의 모든 질문에 답했어! 정말 대단해 🎉', 'ai'), 500);
    setTimeout(completeMission, 1300);
  }
}

function splitScenes(){
  const raw = $('paste').value.replace(/\*\*/g, '').replace(/#+\s*/g, '');
  const parts = raw.split(/\[?\s*([1-4])\s*컷\s*\]?/);
  const found = ['','','',''];
  for (let n = 1; n < parts.length; n += 2){
    const idx = +parts[n] - 1;
    let body = (parts[n+1] || '').trim();
    body = body.replace(/^[:：.\-–—\s]*/, '').replace(/^[기승전결]\s*[—–\-:·]*\s*[^\n]{0,8}\n/, '').trim();
    if (idx >= 0 && idx < 4 && !found[idx]) found[idx] = body;
  }
  if (!found.some(Boolean)){ toast('[1컷] [2컷] 같은 표시를 못 찾았어요. 직접 나눠서 써 줘도 돼요!'); return; }
  found.forEach((t,n) => { if (t){ S.scenes[n] = t; $('sc'+n).value = t; } });
  S.geminiDraft = found.join('|'); save();
  toast('4컷으로 나눴어요! 이제 내 말로 조금씩 고쳐 볼까요? ✏️');
}

  if (S.geminiDraft && S.scenes.join('|') !== S.geminiDraft && !S.editBonus){ S.editBonus = true; addXP(20); toast('내 말로 고쳐 썼네요! 보너스 ⭐ +20'); }
  completeMission();
}

        <div style="font-size:14px;line-height:1.7">${esc(S.scenes[c]) || '<span style="color:var(--ink-soft)">이야기 완성 미션에서 쓴 장면이 여기 나와요</span>'}</div>
      </div>

      <div class="bq"><div class="q">🎥 1. 이 장면을 카메라로 어떻게 찍을까?</div>
        <div class="cam-grid">${CAMERAS.map(x => `<button class="cam ${b.camera===x.v?'sel':''}" onclick="setB('camera','${x.v}')"><b>${x.e}</b>${x.v}<br><span style="font-size:10px;color:var(--ink-soft)">${x.d}</span></button>`).join('')}</div></div>

      <div class="bq"><div class="q">💬 2. 이 장면에서 ${esc(hero)}${hasBatchim(hero)?'이':'가'} 뭐라고 말할까?</div>
        <input id="bLine" value="${esc(b.line)}" placeholder="예) &quot;여기가 어디지? 조금 무서워...&quot;" oninput="setB('line',this.value,true)"></div>

      <div class="bq"><div class="q">🔊 3. 어떤 소리가 들릴까? (효과음)</div>
        <input id="bSound" value="${esc(b.sound)}" placeholder="예) 바스락바스락, 쿵!, 휘이잉~" oninput="setB('sound',this.value,true)"></div>

      <div class="bq"><div class="q">🎨 4. 장면의 분위기는?</div>
        <div class="moods">${MOODS.map(x => `<button class="mood ${b.mood===x.v?'sel':''}" style="background:${x.bg};color:${x.fg}" onclick="setB('mood','${x.v}')">${x.e} ${x.v}</button>`).join('')}</div></div>

      <div class="bq"><div class="q">🖼️ 5. 장면 그림을 만들어요</div>
        <div class="draw-tabs">
          <button class="${view.drawMode==='draw'?'on':''}" onclick="setDraw('draw')">✏️ 직접 그리기</button>
          <button class="${view.drawMode==='gemini'?'on':''}" onclick="setDraw('gemini')">🔷 Gemini 그림</button>
          <button class="${view.drawMode==='upload'?'on':''}" onclick="setDraw('upload')">📷 사진 올리기</button>
        </div>
        <div id="drawArea"></div>
      </div>

      <div class="row">
        ${c > 0 ? `<button class="btn btn-ghost" onclick="go('mission',{cut:${c-1}})">← ${c}컷</button>` : ''}
        ${c < 3 ? `<button class="btn btn-blue" onclick="nextCut()">${c+2}컷으로 →</button>`
                : `<button class="btn btn-purple" onclick="finishBoard()">🎬 스토리보드 완성!</button>`}
      </div>
    </div>`;
  renderDrawArea();
}
function cutDone(n){ const b = S.board[n]; return !!(b.camera && b.line.trim() && b.mood); }
function setB(key, val, quiet){
  const b = S.board[view.cut], wasDone = cutDone(view.cut);
  b[key] = val; save();
  if (!wasDone && cutDone(view.cut)){ addXP(15); toast(`${view.cut+1}컷 장면 설정 완료! ⭐ +15`); }
  // 화면 전체를 다시 그리면 그리던 그림이 지워지니까, 바뀐 부분만 고쳐요
  if (!quiet){
    const sel = key === 'camera' ? '.cam' : '.mood', list = key === 'camera' ? CAMERAS : MOODS;
    document.querySelectorAll(sel).forEach((el,n) => el.classList.toggle('sel', list[n].v === val));
    if (view.drawMode === 'gemini') renderDrawArea();
  }
  document.querySelectorAll('.cut-tabs button')[view.cut].classList.toggle('ok', cutDone(view.cut));
}
function nextCut(){
  if (!cutDone(view.cut)) { toast('카메라, 대사, 분위기를 정하면 다음 컷으로 갈 수 있어요! 🎬'); return; }
  go('mission', { cut: view.cut + 1 });
}
function finishBoard(){
  const miss = [0,1,2,3].filter(n => !cutDone(n));
  if (miss.length){ toast(`${miss.map(n=>n+1).join(', ')}컷이 아직 비어 있어요! (카메라·대사·분위기)`); return; }
  completeMission();
}
function setDraw(mode){ view.drawMode = mode; document.querySelectorAll('.draw-tabs button').forEach((b,n) => b.classList.toggle('on', ['draw','gemini','upload'][n] === mode)); renderDrawArea(); }

function imgPrompt(c){
  const b = S.board[c], a = S.a;
  return `어린이 그림책 스타일로 따뜻하고 귀여운 그림 1장을 그려줘. 그림 안에 글자는 넣지 마.${genre() ? `\n이야기 장르: ${genre().name} (${genre().guide})` : ''}

장면: ${S.scenes[c] || ''}
주인공: ${a.heroName||''} (${a.heroType||''}), 생김새: ${a.heroLook||''}
장소: ${a.place||''}, ${a.placeLook||''}
카메라 구도: ${b.camera || '자유롭게'}
분위기: ${b.mood || '자유롭게'}
가로로 긴 3:2 비율로 그려줘.`;
}
function renderDrawArea(){
  const area = $('drawArea'), b = S.board[view.cut];
  const saved = b.img ? `<div class="lbl" style="margin-top:10px">💾 지금 저장된 그림</div><img class="preview-img" src="${b.img}" alt="${view.cut+1}컷 그림">` : '';
  if (view.drawMode === 'draw'){
    area.innerHTML = `<div class="canvas-wrap"><canvas id="cv" width="600" height="400"></canvas></div>
      <div class="pal" id="pal"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-ghost" onclick="clearCanvas()">🧽 다 지우기</button>
        <button class="btn btn-teal" onclick="saveCanvas()">💾 그림 저장</button>
      </div>`;
    setupCanvas();
  } else if (view.drawMode === 'gemini'){
    area.innerHTML = `<div class="tip" style="margin-bottom:8px">① 버튼을 누르면 내 Gemini가 열리고 그림 주문서가 들어가요.<br>② 그림이 나오면 <b>다운로드</b>해요.<br>③ 여기로 돌아와 <b>📷 사진 올리기</b>로 그림을 넣어요!</div>
      <div class="sum" style="font-size:12px">${esc(imgPrompt(view.cut))}</div>
      <button class="btn btn-gemini" onclick="openGemini(imgPrompt(${view.cut}),'그림 주문서를 보냈어요! 그림을 저장한 뒤 📷 사진 올리기로 넣어요')">🔷 Gemini에게 ${view.cut+1}컷 그림 부탁하기</button>
      ${saved}`;
  } else {
    area.innerHTML = `<label class="btn btn-blue" style="display:block;text-align:center">📷 그림 파일 고르기<input type="file" accept="image/*" style="display:none" onchange="uploadImg(this)"></label>${saved}`;
  }
}
function shrinkTo(src, maxW, cb){
  const im = new Image();
  im.onload = () => {
    const r = Math.min(1, maxW / im.width), cv = document.createElement('canvas');
    cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r);
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.78));
  };
  im.src = src;
}
function storeImg(data){
  const had = !!S.board[view.cut].img;
  S.board[view.cut].img = data; save();
  if (!had){ addXP(10); toast(`${view.cut+1}컷 그림 완성! ⭐ +10`); } else toast('그림을 바꿨어요!');
  renderDrawArea();
}
function uploadImg(inp){
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = e => shrinkTo(e.target.result, 600, storeImg); rd.readAsDataURL(f);
}

// --- 그림판 ---
let pen = { color:'#2C2C3A', size:6, erase:false };
function setupCanvas(){
  const cv = $('cv'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  const b = S.board[view.cut];
  if (b.img){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, cv.width, cv.height); im.src = b.img; }
  const colors = ['#2C2C3A','#FF7B6B','#F9A825','#38C9A0','#4285F4','#7B6CF6','#8B5A2B','#FF9ECF'];
  $('pal').innerHTML = colors.map(c => `<button class="c ${!pen.erase && pen.color===c?'sel':''}" style="background:${c}" onclick="pen.color='${c}';pen.erase=false;setupPal()"></button>`).join('')
    + `<button class="tool ${pen.size===4?'sel':''}" onclick="pen.size=4;setupPal()">가늘게</button>`
    + `<button class="tool ${pen.size===10?'sel':''}" onclick="pen.size=10;setupPal()">굵게</button>`
    + `<button class="tool ${pen.erase?'sel':''}" onclick="pen.erase=true;setupPal()">지우개</button>`;
  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * cv.width / r.width, y:(e.clientY - r.top) * cv.height / r.height }; };
  cv.onpointerdown = e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); dot(last); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  function style(){ ctx.strokeStyle = ctx.fillStyle = pen.erase ? '#fff' : pen.color; ctx.lineWidth = pen.erase ? 24 : pen.size; ctx.lineCap = ctx.lineJoin = 'round'; }
  function dot(p){ style(); ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth/2, 0, Math.PI*2); ctx.fill(); }
  function line(a, b2){ style(); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke(); }
}
function setupPal(){
  // 그림은 그대로 두고 팔레트 표시만 바꿔요
  document.querySelectorAll('#pal .c').forEach(el => el.classList.toggle('sel', !pen.erase && el.style.backgroundColor && rgbHex(el.style.backgroundColor) === pen.color.toLowerCase()));
  const tools = document.querySelectorAll('#pal .tool');
  tools[0].classList.toggle('sel', pen.size === 4); tools[1].classList.toggle('sel', pen.size === 10); tools[2].classList.toggle('sel', pen.erase);
}
function rgbHex(rgb){ const m = rgb.match(/\d+/g); return '#' + m.slice(0,3).map(n => (+n).toString(16).padStart(2,'0')).join(''); }
function clearCanvas(){ const cv = $('cv'), ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); }
function saveCanvas(){ storeImg($('cv').toDataURL('image/jpeg', 0.8)); }

// ===== 완성 스토리북 =====
function renderBook(){
  const a = S.a;
  $('app').innerHTML = `
    <div class="m-top no-print"><button class="back" onclick="go('home')">← 지도</button></div>
    <div class="card">
      <div class="book-title fun">📕 ${esc(a.title || '나의 이야기')}</div>
      ${genre() ? `<div style="text-align:center;margin:6px 0"><span class="genre-tag">${genre().icon} ${genre().name}</span></div>` : ''}
      <div class="book-by">글·그림·감독 <b>${esc(S.name)}</b> · ${level().name}${S.thinks ? ` · 🧠 깊은 생각 ${S.thinks}개` : ''}</div>
      <div class="sb-grid">${[0,1,2,3].map(n => { const b = S.board[n], c = CUT_INFO[n];
        const mood = MOODS.find(x => x.v === b.mood), cam = CAMERAS.find(x => x.v === b.camera);
        return `<div class="sb">
          <div class="frame" style="background:${mood ? mood.bg : '#F6F7FB'}"><span class="num">${n+1}컷 · ${c.t}</span>${b.img ? `<img src="${b.img}" alt="${n+1}컷 그림">` : (cam ? cam.e : '🎬')}</div>
          <div class="info">${esc(S.scenes[n])}
            ${b.line ? `<div class="line">💬 ${esc(b.line)}</div>` : ''}
            <div class="meta">${cam ? `<span>🎥 ${cam.v}</span>` : ''}${b.sound ? `<span>🔊 ${esc(b.sound)}</span>` : ''}${mood ? `<span>${mood.e} ${mood.v}</span>` : ''}</div>
          </div></div>`; }).join('')}</div>
    </div>
    <div class="card no-print">
      <div class="lbl">🏅 ${esc(S.name)} 작가가 모은 배지</div>
      <div class="badges">${MISSIONS.map(m => `<span class="badge ${S.done[m.id]?'':'off'}">${m.badge}</span>`).join('')}</div>
    </div>
    <div class="row no-print">
      <button class="btn btn-teal" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
      <button class="btn btn-gemini" onclick="copyBook()">📋 이야기 글 복사</button>
    </div>`;
  if (MISSIONS.every(m => S.done[m.id]) && !S.bookSeen){ S.bookSeen = true; save(); confetti(); }
}
function copyBook(){
  const txt = `${S.a.title || '나의 이야기'} — 글 ${S.name}\n\n` + S.scenes.map((s,n) => `[${n+1}컷] ${s}${S.board[n].line ? `\n  💬 ${S.board[n].line}` : ''}`).join('\n\n');
  copyText(txt).then(() => toast('이야기를 복사했어요! 📋'));
}

load(); if (genre()) MISSIONS = buildCourse(genre()); render();
</script>
